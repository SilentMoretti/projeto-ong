<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Templates JavaScript</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

    <header>
        <h1>Lista de pessoas</h1>
    </header>

    <nav aria-label="Navegação principal">
        <a href="#formulario">Cadastrar pessoa</a>
        <a href="#lista">Lista de pessoas</a>
    </nav>

    <main>
    <img src="./pessoas comunidade.webp"
         alt="Pessoas da comunidade"
         width="980"
         height="980">

    <button id="botao" type="button">Clique aqui</button>

    <p id="mensagem" aria-live="polite"></p>

    <form id="formulario">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome">

        <button type="submit">Enviar</button>
    </form>

    <div id="lista" aria-live="polite"></div>
</main>

    <footer>
        <p>Projeto desenvolvido para fins acadêmicos.</p>
    </footer>

    <script type="module" src="../js/script.js"></script>
</body>
</html>
